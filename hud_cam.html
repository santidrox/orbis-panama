<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Centro de Monitoreo</title>
<style>
  :root{--bg:#2b2f33;--panel:#3a3f45;--text:#e7e7e7;--muted:#b8c0cc;--accent:#ff3b30;--green:#47d147}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif}
  header{height:70px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#1b1e23,#2b2f33);box-shadow:0 2px 4px rgba(0,0,0,.5)}
  header h1{font-size:28px;color:#00e5ff;text-shadow:0 0 10px #00e5ff88,0 0 20px #00e5ff55}
  main{display:grid;grid-template-columns:340px 1fr;gap:24px;padding:20px}
  aside{background:var(--panel);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
  .card{background:rgba(0,0,0,.15);border:1px solid #00000055;border-radius:12px;padding:12px}
  .label{font-size:13px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .value{font:600 20px/1 monospace;background:#1b1f24;border:1px solid #00000066;border-radius:10px;padding:6px 10px;text-align:center}
  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
  .hint{font-size:12px;color:var(--muted)}
  .ok{color:var(--green)}
  .stage{display:flex;justify-content:center;align-items:center;background:#202429;border-radius:20px;box-shadow:inset 0 0 10px #00000077;position:relative;overflow:hidden}
  .video-wrap{position:relative;display:inline-block;max-width:100%;width:90%;max-height:82vh;aspect-ratio:4/3}
  .video-wrap img{display:block;width:100%;height:100%;object-fit:contain;background:#000;border-radius:14px}
  .overlay{pointer-events:none;position:absolute;inset:0}
  .overlay svg{width:100%;height:100%}
  @media (max-width:1000px){main{grid-template-columns:1fr}.video-wrap{width:100%}}
</style>
</head>
<body>
<header><h1>Centro de Monitoreo</h1></header>

<main>
  <aside>
    <div class="card">
      <div class="label">Estado</div>
      <div class="hint" id="statusHint">Esperando datos...</div>
    </div>

    <div class="card"><div class="label">Temperatura</div>
      <div class="row"><span class="hint">°C</span><div id="temp" class="value">—</div></div>
    </div>

    <div class="card"><div class="label">Humedad</div>
      <div class="row"><span class="hint">%RH</span><div id="hum" class="value">—</div></div>
    </div>

    <div class="card"><div class="label">Polvo</div>
      <div class="row"><span class="hint">µg/m³</span><div id="dust" class="value">—</div></div>
    </div>

    <div class="card"><div class="label">Gravedad</div>
      <div class="row"><span class="hint">m/s²</span><div id="grav" class="value">9.81</div></div>
    </div>

    <div class="card"><div class="label">Atmósfera</div>
      <div class="row"><span class="hint">hPa</span><div id="atm" class="value">1013</div></div>
    </div>

    <div class="card">
      <div class="label">Cámara</div>
      <div class="controls">
        <input id="ipInput" placeholder="IP de la cámara (ej. 192.168.1.50)"/>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <button id="apply">Aplicar</button>
          <button id="modeBtn">Modo: /stream</button>
        </div>
        <div class="hint" style="margin-top:6px">También puedes abrir con <b>?ip=IP_CAM</b></div>
      </div>
    </div>
  </aside>

  <section class="stage">
    <div class="video-wrap">
      <img id="cam" alt="ESP32-CAM stream"/>
      <div class="overlay">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <rect x="0" y="0" width="100" height="100" fill="none" stroke="var(--accent)" stroke-width="0.6" opacity=".7"/>
          <line x1="33.33" y1="0" x2="33.33" y2="100" stroke="var(--accent)" stroke-width="0.4" opacity=".55"/>
          <line x1="66.66" y1="0" x2="66.66" y2="100" stroke="var(--accent)" stroke-width="0.4" opacity=".55"/>
          <line x1="0" y1="33.33" x2="100" y2="33.33" stroke="var(--accent)" stroke-width="0.4" opacity=".55"/>
          <line x1="0" y1="66.66" x2="100" y2="66.66" stroke="var(--accent)" stroke-width="0.4" opacity=".55"/>
          <line x1="50" y1="40" x2="50" y2="60" stroke="var(--accent)" stroke-width="0.9" opacity=".9"/>
          <line x1="40" y1="50" x2="60" y2="50" stroke="var(--accent)" stroke-width="0.9" opacity=".9"/>
        </svg>
      </div>
    </div>
  </section>
</main>

<script>
  // ==== Cámara ====
  let CAM_IP   = new URLSearchParams(location.search).get("ip") || "";
  let CAM_MODE = "stream";
  const imgEl = document.getElementById("cam");
  const ipInput = document.getElementById("ipInput");
  const applyBtn = document.getElementById("apply");
  const modeBtn = document.getElementById("modeBtn");
  const statusHint = document.getElementById("statusHint");

  function setSrc(){
    if(!CAM_IP){ statusHint.textContent="Ingresa la IP de la cámara"; return; }
    imgEl.src = CAM_MODE==="stream" ? `http://${CAM_IP}/stream` : `http://${CAM_IP}/jpg?cb=${Date.now()}`;
    modeBtn.textContent = `Modo: /${CAM_MODE}`;
  }
  ipInput.value = CAM_IP;
  applyBtn.onclick = ()=>{ CAM_IP = ipInput.value.trim(); setSrc(); }
  modeBtn.onclick  = ()=>{ CAM_MODE = (CAM_MODE==="stream") ? "jpg" : "stream"; setSrc(); }
  setSrc();

  // ==== Datos (pull cada 1 s) ====
  async function pullMetrics(){
    try{
      const r = await fetch("/metrics.json", {cache:"no-store"});
      const m = await r.json();
      if (m.temp     != null) document.getElementById("temp").textContent = (+m.temp).toFixed(1);
      if (m.humidity != null) document.getElementById("hum").textContent  = (+m.humidity).toFixed(1);
      if (m.dust     != null) document.getElementById("dust").textContent = (+m.dust).toFixed(0);
      if (m.gravity  != null) document.getElementById("grav").textContent = (+m.gravity).toFixed(2);
      if (m.atm      != null) document.getElementById("atm").textContent  = (+m.atm).toFixed(0);
      if (m.last_update_human) statusHint.textContent = "Última métrica: " + m.last_update_human;
    }catch(e){
      statusHint.textContent = "Sin conexión al servidor";
    }
  }
  setInterval(pullMetrics, 1000);
  pullMetrics();
</script>
</body>
</html>
